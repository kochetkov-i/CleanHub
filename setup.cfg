[mypy]
ignore_missing_imports = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_defs = True

[isort]
profile = django
skip = migrations, .venv, env, venv, .env, gitignore, setup.cfg, README.md, Makefile
line_length = 100

[flake8]
exclude =
    __pycache__,
    venv,
    .venv,
    */migrations/*
max-line-length = 100
max-complexity = 8
unused-arguments-ignore-abstract-functions = True

[tool:pytest]
DJANGO_SETTINGS_MODULE = cleanhub.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests
norecursedirs =
    hooks
    .git
    .tox
    dist
    build
    eggs
    *.egg
    .venv
    venv
    migrations
    __pycache__
testdox_format = plaintext
addopts =
  --strict
  --tb=short
  --show-capture=stderr
  --testdox
  --no-header
  --junit-xml=report.xml

filterwarnings = ignore::DeprecationWarning
                 ignore::UserWarning

env_files =
    .env
    test.env
    ./cleanhub/.env

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  run_style:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Set up python
      - uses: actions/actions/setup-python@v6.0.0
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: make install

      - name: Check style
        run: make style

  run_types:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Set up python
      - uses: actions/actions/setup-python@v6.0.0
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: make install

      - name: Check types
        run: make types

      - name: Run tests
        run: make tests

  run_tests:
    runs-on: [ubuntu-latest]
    needs: [run_style, run_types]
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Set up python
      - uses: actions/actions/setup-python@v6.0.0
        with:
          python-version-file: '.python-version'

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make tests

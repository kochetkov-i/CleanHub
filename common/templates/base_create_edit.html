{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="d-flex justify-content-center">
  <h2>{{title}}</h2>
</div>
<div class="box">
  <div class="d-flex justify-content-center">
    <div class="col-6 mb-4">
      <form id="mainForm" class="container" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button id="mainSubmitButton" class="btn btn-primary m-2" type="submit">Сохранить</button>
        <a href="{{ cancel_url }}" class="btn btn-secondary">Отменить</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
